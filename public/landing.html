<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptLineAI</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
  <style>
    .landing { max-width: 720px; margin: 64px auto; padding: 0 16px; }
    .landing h1 { margin-bottom: 8px; }
    .landing p { color: #555; }
    .landing .actions { margin-top: 24px; display: flex; gap: 12px; }
    .btn { appearance: none; border: 1px solid #ddd; background: #111; color: #fff; padding: 10px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: 600; }
    .btn.secondary { background: #fff; color: #111; }
    .status { margin-top: 16px; color: #555; }
    .error { margin-top: 16px; color: #b42318; }
    .auth-container { margin-top: 24px; }
    .auth-container.hidden { display: none; }
    .auth-tabs { display: flex; gap: 12px; margin-bottom: 16px; }
    .auth-tab { padding: 8px 16px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 4px; }
    .auth-tab.active { background: #111; color: #fff; border-color: #111; }
  </style>
</head>
<body>
  <div class="landing">
    <h1>PromptLineAI</h1>
    <p>Sign in to view your organization dashboard.</p>

    <div id="status" class="status">Checking session…</div>
    <div id="error" class="error" style="display:none;"></div>

    <!-- Embedded Clerk components (shown when signed out) -->
    <div id="auth-container" class="auth-container hidden">
      <div class="auth-tabs">
        <button id="tab-sign-in" class="auth-tab active">Sign In</button>
        <button id="tab-sign-up" class="auth-tab">Sign Up</button>
      </div>
      <div id="sign-in-container"></div>
      <div id="sign-up-container" style="display:none;"></div>
    </div>
  </div>

  <script src="/env.js"></script>
  <script src="/assets/auth.js"></script>
  <script>
    (async () => {
      const statusEl = document.getElementById('status');
      const errorEl = document.getElementById('error');
      const authContainer = document.getElementById('auth-container');
      const signInContainer = document.getElementById('sign-in-container');
      const signUpContainer = document.getElementById('sign-up-container');
      const tabSignIn = document.getElementById('tab-sign-in');
      const tabSignUp = document.getElementById('tab-sign-up');

      // Tab switching
      tabSignIn.addEventListener('click', () => {
        tabSignIn.classList.add('active');
        tabSignUp.classList.remove('active');
        signInContainer.style.display = '';
        signUpContainer.style.display = 'none';
      });

      tabSignUp.addEventListener('click', () => {
        tabSignUp.classList.add('active');
        tabSignIn.classList.remove('active');
        signUpContainer.style.display = '';
        signInContainer.style.display = 'none';
      });

      try {
        console.log('[Diagnostic] Starting initialization...');
        await window.PromptLineAuth.initClerk();
        console.log('[Diagnostic] initClerk completed successfully');
        
        // Check if user is already signed in
        console.log('[Diagnostic] Checking for existing token...');
        const token = await window.PromptLineAuth.getToken();
        console.log('[Diagnostic] Token check result:', token ? 'Token exists' : 'No token');
        if (token) {
          statusEl.textContent = 'Signing you in…';
          const res = await fetch('/me', {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (res.status === 401) {
            statusEl.textContent = 'You are signed out.';
            authContainer.classList.remove('hidden');
            // Mount components for sign-in
            window.PromptLineAuth.mountSignIn(signInContainer, {
              fallbackRedirectUrl: window.location.origin,
            });
            return;
          }
          if (res.status === 403) {
            statusEl.textContent = 'Signed in, but not assigned to an organization.';
            return;
          }
          if (!res.ok) {
            throw new Error(`Failed to load /me: ${res.status}`);
          }

          const me = await res.json();
          const slug = me?.org?.slug;
          if (!slug) throw new Error('Missing org.slug in /me response');

          window.location.href = `/${encodeURIComponent(slug)}`;
          return;
        }

        // User is signed out - show embedded components
        statusEl.textContent = '';
        authContainer.classList.remove('hidden');
        
        // Mount sign-in and sign-up components
        console.log('[Diagnostic] Before mounting components...');
        console.log('[Diagnostic] signInContainer:', signInContainer, 'type:', typeof signInContainer);
        console.log('[Diagnostic] signUpContainer:', signUpContainer, 'type:', typeof signUpContainer);
        console.log('[Diagnostic] window.Clerk.mountSignIn type:', typeof window.Clerk?.mountSignIn);
        console.log('[Diagnostic] window.Clerk.mountSignUp type:', typeof window.Clerk?.mountSignUp);
        
        window.PromptLineAuth.mountSignIn(signInContainer, {
          fallbackRedirectUrl: window.location.origin,
        });
        console.log('[Diagnostic] Sign-in component mount call completed');
        
        window.PromptLineAuth.mountSignUp(signUpContainer, {
          fallbackRedirectUrl: window.location.origin,
        });
        console.log('[Diagnostic] Sign-up component mount call completed');

        // Listen for sign-in/sign-up completion
        console.log('[Diagnostic] Before addListener check...');
        console.log('[Diagnostic] window.Clerk:', window.Clerk);
        console.log('[Diagnostic] window.Clerk.addListener type:', typeof window.Clerk?.addListener);
        console.log('[Diagnostic] window.Clerk.on type:', typeof window.Clerk?.on);
        console.log('[Diagnostic] window.Clerk.addEventListener type:', typeof window.Clerk?.addEventListener);
        console.log('[Diagnostic] window.Clerk.methods:', window.Clerk ? Object.keys(window.Clerk).filter(k => typeof window.Clerk[k] === 'function').slice(0, 30) : 'N/A');
        
        // Try to find the correct event listener method
        const eventMethod = window.Clerk?.addListener || window.Clerk?.on || window.Clerk?.addEventListener;
        console.log('[Diagnostic] Event listener method found:', eventMethod ? (window.Clerk?.addListener ? 'addListener' : window.Clerk?.on ? 'on' : 'addEventListener') : 'NONE');
        
        if (window.Clerk && eventMethod) {
          console.log('[Diagnostic] Registering event listener for "user" event using:', window.Clerk?.addListener ? 'addListener' : window.Clerk?.on ? 'on' : 'addEventListener');
          try {
            eventMethod.call(window.Clerk, 'user', async () => {
              console.log('[Diagnostic] User event listener callback triggered');
            // User signed in/up - check auth and redirect
            const newToken = await window.PromptLineAuth.getToken();
            if (newToken) {
              statusEl.textContent = 'Signing you in…';
              try {
                const res = await fetch('/me', {
                  headers: { Authorization: `Bearer ${newToken}` }
                });

                if (res.ok) {
                  const me = await res.json();
                  const slug = me?.org?.slug;
                  if (slug) {
                    window.location.href = `/${encodeURIComponent(slug)}`;
                  }
                }
              } catch (err) {
                console.error('Failed to redirect after sign-in:', err);
              }
            }
            });
            console.log('[Diagnostic] Event listener registered successfully');
          } catch (listenerError) {
            console.error('[Diagnostic] Failed to register event listener:', listenerError);
            console.error('[Diagnostic] Listener error type:', typeof listenerError);
            console.error('[Diagnostic] Listener error details:', listenerError);
          }
        } else {
          console.warn('[Diagnostic] No event listener method available on window.Clerk');
          console.warn('[Diagnostic] window.Clerk exists:', !!window.Clerk);
          console.warn('[Diagnostic] addListener exists:', !!window.Clerk?.addListener);
          console.warn('[Diagnostic] on exists:', !!window.Clerk?.on);
          console.warn('[Diagnostic] addEventListener exists:', !!window.Clerk?.addEventListener);
        }
      } catch (e) {
        console.error('[Diagnostic] Error caught in main try-catch block');
        console.error('[Diagnostic] Error type:', typeof e);
        console.error('[Diagnostic] Error constructor:', e?.constructor?.name);
        console.error('[Diagnostic] Error instanceof Error:', e instanceof Error);
        console.error('[Diagnostic] Error message:', e?.message);
        console.error('[Diagnostic] Error stack:', e?.stack);
        console.error('[Diagnostic] Full error object:', e);
        console.error('[Diagnostic] String(e):', String(e));
        console.error('[Diagnostic] JSON.stringify(e):', JSON.stringify(e, Object.getOwnPropertyNames(e)));
        
        statusEl.textContent = 'Unable to initialize authentication.';
        errorEl.style.display = 'block';
        errorEl.textContent = (e instanceof Error ? e.message : (typeof e === 'string' ? e : String(e))) || 'Unknown error occurred';
      }
    })();
  </script>
</body>
</html>
