<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptLineAI Dashboard</title>
  <!-- Legacy dashboard entrypoint (not served at / anymore). Keep URLs working. -->
  <link rel="stylesheet" href="/assets/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>PromptLineAI Dashboard</h1>
      <div class="range-selector">
        <button id="range-24h" class="range-btn active" data-range="24h">24h</button>
        <button id="range-7d" class="range-btn" data-range="7d">7d</button>
        <button id="range-30d" class="range-btn" data-range="30d">30d</button>
      </div>
    </header>

    <div id="error-banner" class="error-banner hidden">
      <span id="error-message"></span>
      <button id="retry-btn" class="retry-btn">Retry</button>
    </div>

    <div id="dashboard-content">
      <!-- Summary Cards -->
      <section class="summary-cards">
        <div class="card">
          <h2>Total Events</h2>
          <div id="total-events" class="card-value">Loading...</div>
        </div>
        <div class="card">
          <h2>Unique Users</h2>
          <div id="unique-users" class="card-value">Loading...</div>
        </div>
      </section>

      <!-- Tools Breakdown -->
      <section class="chart-section">
        <h2>Events by Tool</h2>
        <div class="chart-container">
          <div class="table-container">
            <table id="tools-table">
              <thead>
                <tr>
                  <th>Tool</th>
                  <th>Count</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colspan="2">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="chart-wrapper">
            <canvas id="tools-chart"></canvas>
          </div>
        </div>
      </section>

      <!-- Event Types Breakdown -->
      <section class="chart-section">
        <h2>Events by Type</h2>
        <div class="chart-container">
          <div class="table-container">
            <table id="event-types-table">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Count</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colspan="2">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="chart-wrapper">
            <canvas id="event-types-chart"></canvas>
          </div>
        </div>
      </section>

      <!-- Time Series Chart -->
      <section class="chart-section">
        <h2>Events Over Time</h2>
        <div class="chart-wrapper-full">
          <canvas id="time-chart"></canvas>
        </div>
      </section>

      <!-- File Uploads Table -->
      <section class="chart-section">
        <h2>File Uploads</h2>
        <div class="table-container-full">
          <table id="files-table">
            <thead>
              <tr>
                <th>File Name</th>
                <th>Uploads</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="2">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script src="/env.js"></script>
  <script src="/assets/auth.js"></script>
  <script src="/assets/dashboard.js"></script>
</body>
</html>
